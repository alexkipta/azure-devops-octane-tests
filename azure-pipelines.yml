# azure-pipelines.yml

trigger:
- none

parameters:
  - name: runExtraStep
    type: boolean
    default: true

  - name: mavenGoals
    type: string
    default: 'clean test'

  - name: unitTestResultsGlobPattern
    type: string
    default: '**/surefire-reports/TEST-*.xml'

  - name: octane_auto_action_execution_id
    type: string
    displayName: "Octane auto action execution id"
    default: 'costeloupdate'

pool: Default

steps:
# Expose parameters as runtime variables
- task: octane-start-task@26
  inputs:
    OctaneServiceConnection: 'Costea connection'
    WorkspaceList: '1003'
    CreatePipelineCheckbox: true


- script: |
    echo "Hello!"
    echo "This is a regular script step."
    echo "Parameter value for runExtraStep: ${{ parameters.runExtraStep }}"
    echo "Parameter value for mavenGoals: ${{ parameters.mavenGoals }}"
    echo "Server URI is: $(System.TeamFoundationCollectionUri)"
  displayName: 'Say Hello'

- task: Maven@4
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean test'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    javaHomeOption: 'JDKVersion'
    mavenVersionOption: 'Default'
    mavenAuthenticateFeed: false
    effectivePomSkip: false
    sonarQubeRunAnalysis: false
  continueOnError: true

# Optional step based on parameter
- ${{ if eq(parameters.runExtraStep, true) }}:
  - script: |
      echo "This extra step runs only if runExtraStep is true."
    displayName: 'Optional Extra Step'

- task: octane-end-task@26
  inputs:
    OctaneServiceConnection: 'Costea connection'
    WorkspaceList: '1003'
    Framework: 'junit'
  env:
    UNIT_TEST_RESULTS_GLOB_PATTERN: ${{ parameters.unitTestResultsGlobPattern }}